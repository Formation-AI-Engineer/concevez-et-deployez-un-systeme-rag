[project]
name = "assistant-rag-evenements-culturels"
version = "0.1.0"
description = "POC d'un assistant RAG (LangChain + Mistral + FAISS) recommandant des événements culturels à partir des données Open Agenda — Puls-Events"
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    # --- Orchestration RAG ---
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    # --- Modèle / embeddings ---
    "mistralai>=1.0.0",
    "sentence-transformers>=3.0.0",
    # --- Base vectorielle (CPU pour la portabilité, cf. énoncé) ---
    "faiss-cpu>=1.8.0",
    # --- Récupération & manipulation des données Open Agenda ---
    "requests>=2.32.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    # --- API REST ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# Évaluation automatique de la qualité des réponses (étape 4/5).
eval = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "api"]
