# Étape 6.1 (optionnel) — lancement simplifié de l'API conteneurisée.
#
#   docker compose up --build      # build + démarrage
#   docker compose down            # arrêt
#
# Les secrets (au minimum MISTRAL_API_KEY) sont lus depuis .env.local — non versionné.
# Copier .env.example -> .env.local et renseigner la clé avant le premier lancement.

services:
  api:
    build: .
    image: assistant-rag-evenements:latest
    container_name: assistant-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    restart: unless-stopped
