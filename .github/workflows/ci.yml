name: CI

# Étape 5.5 — intégration continue : lint + tests à chaque push/PR, et évaluation Ragas
# déclenchable manuellement (elle nécessite une clé Mistral et les données, non versionnées).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install 3.11

      - name: Synchroniser les dépendances (dev)
        run: uv sync --extra dev

      # Le modèle d'embeddings (sentence-transformers) est téléchargé par certains tests :
      # on met en cache ~/.cache/huggingface pour accélérer les exécutions suivantes.
      - name: Cache des modèles HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q

  evaluate:
    name: Évaluation RAG (Ragas) — manuel
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # N'échoue jamais le pipeline : l'évaluation dépend de données non versionnées et d'une API.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install 3.11

      - name: Synchroniser les dépendances (dev + eval)
        run: uv sync --extra dev --extra eval

      - name: Évaluer la qualité des réponses
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ ! -f data/processed/events.parquet ]; then
            echo "::warning::Données absentes (data/processed/events.parquet non versionné) — évaluation ignorée."
            exit 0
          fi
          uv run python scripts/build_index.py
          uv run python scripts/evaluate_rag.py --sample 5

      - name: Publier le rapport d'évaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-evaluation-rag
          path: eval/reports/
          if-no-files-found: ignore
