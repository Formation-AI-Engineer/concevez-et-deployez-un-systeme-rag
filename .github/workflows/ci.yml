name: CI

# Étape 5.5 — intégration continue : lint + tests à chaque push/PR, et évaluation Ragas
# déclenchable manuellement (elle nécessite une clé Mistral et les données, non versionnées).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install 3.11

      - name: Synchroniser les dépendances (dev)
        run: uv sync --extra dev

      # Le modèle d'embeddings (sentence-transformers) est téléchargé par certains tests :
      # on met en cache ~/.cache/huggingface pour accélérer les exécutions suivantes.
      - name: Cache des modèles HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q

  evaluate:
    name: Évaluation RAG (Ragas) — manuel
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # N'échoue jamais le pipeline : l'évaluation dépend de données non versionnées et d'une API.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer Python
        run: uv python install 3.11

      - name: Synchroniser les dépendances (dev + eval)
        run: uv sync --extra dev --extra eval

      # Pipeline complet : récupération Open Agenda -> structuration -> index FAISS -> évaluation.
      # On récupère un échantillon réduit (rapidité/coût). NB : ce jeu est un instantané frais,
      # distinct de l'index local sur lequel eval/qa_dataset.json est ancré — les métriques de
      # couverture/ancrage peuvent donc différer du run local ; ici on valide surtout que la
      # chaîne d'évaluation s'exécute de bout en bout (smoke + métriques sémantiques/Ragas).
      - name: Évaluer la qualité des réponses
        env:
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          API_REBUILD_TOKEN: ${{ secrets.API_REBUILD_TOKEN }}
        run: |
          if [ -z "$OPENAGENDA_API_KEY" ] || [ -z "$MISTRAL_API_KEY" ]; then
            echo "::warning::Secrets MISTRAL_API_KEY / OPENAGENDA_API_KEY manquants — évaluation ignorée."
            exit 0
          fi
          uv run python scripts/fetch_events.py --target-events 300 --max-agendas 15
          uv run python scripts/preprocess_events.py
          uv run python scripts/build_index.py
          uv run python scripts/evaluate_rag.py --sample 5

      - name: Publier le rapport d'évaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-evaluation-rag
          path: eval/reports/
          if-no-files-found: ignore
